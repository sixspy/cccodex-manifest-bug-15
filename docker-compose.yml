services:
  manifest-lab:
    build: .
    container_name: cc-manifest-lab-manifest-bug-15
    ports:
      - "7240:6900"
    environment:
      HOST: "0.0.0.0"
      PORT: "6900"
      DATABASE_PATH: /app/instance/manifest_lab.db
    volumes:
      - manifest_lab_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6900/login', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  manifest_lab_data:
